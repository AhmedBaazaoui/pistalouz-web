<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233D32">
<title>Pistalouz</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pistalouz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --g:#233D32; --g2:#3E6B55; --gl:#E3EDE5; --beige:#EAD9A8;
  --b:#8A5A2B; --bl:#F3E6D3; --bg:#F7F2E9; --card:#fff;
  --t:#2B2A26; --m:#7A766C; --line:#E6DED0;
  --red:#B23A2E; --redl:#F8E1DE; --ok:#2F7A3A; --okl:#DFF0DD; --am:#B7791F; --aml:#FBEFD9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:"Tajawal","Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header h1{font-size:21px;margin:0;font-weight:800;color:var(--beige);font-family:system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:.3px;line-height:1.1}
.brand{flex:1;display:flex;align-items:center;gap:10px}
.brand .lg{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;flex:0 0 auto}
.brand .lg svg{width:100%;height:100%;display:block}
.brand small{display:block;font-size:12px;color:#cfdcd2;font-weight:400}
header .ic{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.06)}
nav button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button b{font-size:22px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
nav .fab{flex:0 0 auto;width:62px;height:62px;border-radius:50%;background:var(--b);color:#fff;font-size:34px;margin-top:-26px;box-shadow:0 4px 12px rgba(138,90,43,.45);justify-content:center}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;color:var(--g);display:flex;align-items:center;gap:8px}
.card h2 small{margin-inline-start:auto;font-weight:400;color:var(--m);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px}
.tile .l{font-size:12px;color:var(--m)}
.tile .v{font-size:19px;font-weight:800;margin-top:2px}
.tile .s{font-size:12px;color:var(--m);margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--m);font-weight:500}
td.r,th.r{text-align:end}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--m);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;color:var(--t)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.k-buy{background:var(--bl)} .k-crack{background:#E9E4F5} .k-blanch{background:#E2EEF6} .k-sell{background:var(--gl)}
.item .t{font-weight:700}
.item .d{font-size:13px;color:var(--m);margin-top:2px}
.item .amt{text-align:end;flex:0 0 auto}
.item .amt .v{font-weight:800}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-top:4px}
.st.ok{background:var(--okl);color:var(--ok)} .st.part{background:var(--aml);color:var(--am)} .st.no{background:var(--redl);color:var(--red)}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g2)}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 5px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font:inherit;font-size:15px;color:var(--t)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--g);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:700;background:var(--g);color:#fff;margin-top:14px}
.btn.sec{background:var(--bg);color:var(--t);border:1px solid var(--line)}
.btn.br{background:var(--b)}
.btn.red{background:var(--redl);color:var(--red)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.sum{background:var(--gl);border-radius:12px;padding:12px;margin-top:12px;font-size:15px}
.sum .big{font-size:22px;font-weight:800;color:var(--g)}
.warn{background:var(--redl);color:var(--red);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px}
.info{background:var(--aml);color:#7a5210;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{margin-top:12px}
#ov{position:fixed;inset:0;background:rgba(30,25,15,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 10px}
.sheet h3{margin:0 0 6px;font-size:19px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-inline-start:auto;border:0;background:var(--bg);border-radius:10px;width:36px;height:36px;font-size:18px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.kv span:first-child{color:var(--m)}
.kv span:last-child{text-align:end}
.pay{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pay button{border:0;background:var(--redl);color:var(--red);border-radius:8px;width:30px;height:30px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.menu button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:18px 8px;font:inherit;font-size:16px;font-weight:700;color:var(--t);display:flex;flex-direction:column;align-items:center;gap:6px}
.menu button b{font-size:30px}
.menu button small{font-weight:400;color:var(--m);font-size:12px}
#lock{position:fixed;inset:0;z-index:100;background:var(--g);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock .lg{width:86px;height:86px;border-radius:50%;background:#fff;padding:3px;margin-bottom:10px}
#lock .lg svg{width:100%;height:100%}
#lock h2{margin:4px 0 2px;color:var(--beige);font-family:system-ui,sans-serif;font-size:26px}
#lock .msg{min-height:22px;margin:10px 0;font-size:15px;color:#cfdcd2}
#lock .msg.err{color:#ffb4a8}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--beige);display:block}
.dots i.f{background:var(--beige)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.keys button{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:28px;font-family:system-ui,sans-serif}
.keys button:active{background:rgba(255,255,255,.3)}
.keys .blank{background:none}
.bkup{background:var(--aml);border:1px solid #E8C98A;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:14px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:40;background:#2B2A26;color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;display:none;max-width:90vw;text-align:center}
#toast.err{background:var(--red)}
.empty{text-align:center;color:var(--m);padding:30px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.search{margin-bottom:10px}
.stockcat{margin-bottom:10px}
.stockcat:last-child{margin-bottom:0}
.stockcat .nm{font-weight:800;margin-bottom:6px}
.bar3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bar3 div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.bar3 .l{font-size:11px;color:var(--m)} .bar3 .v{font-weight:800;font-size:16px} .bar3 .c{font-size:11px;color:var(--m)}
.help{font-size:12px;color:var(--m);margin-top:4px}
.daterow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--m);margin-top:4px}
.daterow b{color:var(--t)}
.lnk{border:0;background:none;color:var(--g2);font:inherit;font-size:13px;text-decoration:underline;margin-inline-start:auto}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.prow.on{border-color:var(--g);background:var(--gl)}
.menu .pay1{background:#FBEDEA} .menu .pay2{background:var(--gl)}
.rcpt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.btn.wa{background:#1F8F4E}
.pnav{display:flex;align-items:center;gap:8px;margin:10px 0}
.pnav button{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;height:40px;font-size:18px}
.pnav b{flex:1;text-align:center;font-size:16px}
.bigp{border-radius:14px;padding:14px;margin-top:10px;text-align:center}
.bigp .l{font-size:13px;color:var(--m)} .bigp .v{font-size:28px;font-weight:800}
.bigp.pos{background:var(--okl)} .bigp.neg{background:var(--redl)}
.st.pf{background:var(--okl);color:var(--ok)} .st.ls{background:var(--redl);color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="lg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108"><path d="M34.91,32.57 A31,31 0 1,0 73.09,32.57 L70.32,32.12 A26.5,26.5 0 1,1 37.68,32.12 Z" fill="#3B2416"/><g transform="translate(61 37) rotate(28) scale(1.0)"><path d="M0,-16 C8,-9 8,7 0,16 C-8,7 -8,-9 0,-16 Z" fill="#5F8C2C"/><path d="M0,-13 L0,13" fill="none" stroke="#E9F2D2" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(52 33) rotate(18) scale(1.12)"><path d="M0,-16 C8,-9 8,7 0,16 C-8,7 -8,-9 0,-16 Z" fill="#8DBE3F"/><path d="M0,-13 L0,13" fill="none" stroke="#F2F8E2" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(65 61) rotate(26) scale(0.95)"><path d="M0,-18 C10,-11 11.5,7 0,18 C-11.5,7 -10,-11 0,-18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-18 C10,-11 11.5,7 0,18 C-11.5,7 -10,-11 0,-18 Z" fill="#E3A04A" stroke="#3B2416" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-15 C2.5,-5 2.5,5 0,15" fill="none" stroke="#F6D59B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4,-12 C-7.5,-3 -7,6 -3,13" fill="none" stroke="#C77F2E" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-12 C7,-3 6.5,6 3,13" fill="none" stroke="#C77F2E" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(46 61) rotate(-22) scale(1.12)"><path d="M0,-18 C10,-11 11.5,7 0,18 C-11.5,7 -10,-11 0,-18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-18 C10,-11 11.5,7 0,18 C-11.5,7 -10,-11 0,-18 Z" fill="#E3A04A" stroke="#3B2416" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-15 C2.5,-5 2.5,5 0,15" fill="none" stroke="#F6D59B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4,-12 C-7.5,-3 -7,6 -3,13" fill="none" stroke="#C77F2E" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-12 C7,-3 6.5,6 3,13" fill="none" stroke="#C77F2E" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div><div><h1>Pistalouz</h1><small>إدارة تجارتك بذكاء</small></div></div>
  <button class="ic" data-act="settings" aria-label="الإعدادات">⚙️</button>

<script>
"use strict";
/* ================== أدوات ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){
  if(v==null) return 0;
  let s=String(v).trim()
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫,]/g,'.').replace(/\s/g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const r3=x=>Math.round((x||0)*1000)/1000;
const r2=x=>Math.round((x||0)*100)/100;
function grp(i){return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function money(x){x=r3(x);const neg=x<0;let [i,d]=Math.abs(x).toFixed(3).split('.');return '<span class="n">'+(neg?'-':'')+grp(i)+'.'+d+'</span>';}
function moneyT(x){x=r3(x);const neg=x<0;let [i,d]=Math.abs(x).toFixed(3).split('.');return (neg?'-':'')+grp(i)+'.'+d;}
function kgT(x){x=r2(x);let s=Math.abs(x).toFixed(2).replace(/\.?0+$/,'');let [i,d]=s.split('.');return (x<0?'-':'')+grp(i)+(d?'.'+d:'');}
function kg(x){return '<span class="n">'+kgT(x)+'</span>';}
function pct(x){return '<span class="n">'+(Math.round((x||0)*10)/10)+'%</span>';}
const CUR='د.ت';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function thisMonth(){return today().slice(0,7);}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDT(d,t){return fmtDate(d)+(t?' <span class="n">'+t+'</span>':'');}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function periodRange(per,a){
  const d=pd(a);
  if(per==='day')return {s:a,e:a,l:'يوم '+fmtDate(a)};
  if(per==='week'){const st=new Date(d);st.setDate(d.getDate()-((d.getDay()+6)%7));const en=new Date(st);en.setDate(st.getDate()+6);return {s:ds(st),e:ds(en),l:'أسبوع '+fmtDate(ds(st))+' – '+fmtDate(ds(en))};}
  if(per==='month'){const st=new Date(d.getFullYear(),d.getMonth(),1),en=new Date(d.getFullYear(),d.getMonth()+1,0);return {s:ds(st),e:ds(en),l:monthName(ds(st).slice(0,7))};}
  return {s:d.getFullYear()+'-01-01',e:d.getFullYear()+'-12-31',l:'سنة '+d.getFullYear()};
}
function shiftAnchor(per,a,k){const d=pd(a);if(per==='day')d.setDate(d.getDate()+k);else if(per==='week')d.setDate(d.getDate()+7*k);else if(per==='month'){d.setDate(1);d.setMonth(d.getMonth()+k);}else d.setFullYear(d.getFullYear()+k);return ds(d);}
const MONTHS=['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthName(m){if(!m||m==='all')return 'كل الأشهر';const [y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y;}
function fmtDate(d){if(!d)return '';const [y,m,dd]=d.split('-');return '<span class="n">'+dd+'/'+m+'/'+y+'</span>';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
let toastT=null;
function toast(msg,cls){const t=$('#toast');t.textContent=msg;t.className=cls||'';t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600);}

/* ================== التخزين ================== */
const KEY='daftar_lawz_v1';
const BR=(typeof window.AndroidBridge!=='undefined')?window.AndroidBridge:null;
function defState(){return {v:1,recs:{},cats:['لوز','فستق'],fees:{crack:'',blanch:''},biz:{name:'',phone:''},exps:{},lastAuto:'',savedAt:0};}
let S=defState();
function loadState(){
  let a=null,b=null;
  try{const r=localStorage.getItem(KEY);if(r)a=JSON.parse(r);}catch(e){}
  if(BR&&BR.loadData){try{const r=BR.loadData();if(r)b=JSON.parse(r);}catch(e){}}
  let pick=a;
  if(b&&(!a||(b.savedAt||0)>(a.savedAt||0)))pick=b;
  if(pick&&pick.recs)S=Object.assign(defState(),pick);if(!S.exps)S.exps={};
}
function save(){
  S.savedAt=Date.now();
  const t=today();
  let doAuto=false;
  if(BR&&BR.autoBackup&&S.lastAuto!==t&&Object.keys(S.recs).length){S.lastAuto=t;doAuto=true;}
  const raw=JSON.stringify(S);
  let ok=false;
  try{localStorage.setItem(KEY,raw);ok=true;}catch(e){}
  if(BR&&BR.saveData){try{if(BR.saveData(raw))ok=true;}catch(e){}}
  if(doAuto){try{BR.autoBackup('نسخة-'+t+'.json',raw);}catch(e){}}
  if(!ok)toast('⚠️ تعذّر الحفظ في الهاتف','err');
  LC=null;
}

/* ================== الحسابات ================== */
const FORMS={shell:'بقشرته',kernel:'قلب',blanched:'مبيّض'};
function recs(){return Object.values(S.recs).filter(r=>!r.deleted);}
function exps(){return Object.values(S.exps||{}).filter(x=>!x.deleted).sort((a,b)=>(b.date+b.time)<(a.date+a.time)?-1:1);}
function total(r){
  if(r.kind==='buy'){return r.mode==='baz'?r3(r.shellKg*(r.ratio/100)*r.price):r3(r.shellKg*r.price);}
  if(r.kind==='proc'){return r3(r.fee*(r.feeOn==='out'?r.outKg:r.inKg));}
  if(r.kind==='sell'){return r3(r.kg*r.price);}
  return 0;
}
function paid(r){return r3((r.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));}
function rest(r){return r3(total(r)-paid(r));}
function status(r){const t=total(r),p=paid(r);if(t-p<=0.0005)return ['ok','خالص'];if(p>0)return ['part','جزئي'];return ['no','غير خالص'];}
function role(r){return r.kind==='buy'?'seller':r.kind==='proc'?'provider':'customer';}
const ROLES={seller:'البائعون',provider:'مزوّدو الخدمة',customer:'المشترون'};
function kindLabel(r){
  if(r.kind==='buy')return r.mode==='baz'?'شراء باز':'شراء بالكيلو';
  if(r.kind==='proc')return r.ptype==='crack'?'تكسير':'تبييض';
  return 'بيع';
}
function kindIcon(r){return r.kind==='buy'?'🛒':r.kind==='sell'?'💰':r.ptype==='crack'?'🔨':'💧';}
function kindCls(r){return r.kind==='buy'?'k-buy':r.kind==='sell'?'k-sell':r.ptype==='crack'?'k-crack':'k-blanch';}
function sorted(list){return list.slice().sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)));}

/* المخزون و الكلفة بالمعدّل المرجّح */
let LC=null;
function ledger(){
  if(LC)return LC;
  const pools={},cogs={},avgAt={};
  const P=(c,f)=>{pools[c]=pools[c]||{};return pools[c][f]=pools[c][f]||{kg:0,val:0,last:0};};
  const add=(p,k,v)=>{p.kg+=k;p.val+=v;if(p.kg>0.0001)p.last=p.val/p.kg;};
  const take=(p,k)=>{const a=p.kg>0.0001?p.val/p.kg:p.last;p.kg-=k;p.val-=k*a;if(Math.abs(p.kg)<0.0001){p.kg=0;p.val=0;}return k*a;};
  for(const r of sorted(recs())){
    if(r.kind==='buy'){add(P(r.cat,'shell'),r.shellKg,total(r));}
    else if(r.kind==='proc'){
      const from=r.ptype==='crack'?'shell':'kernel',to=r.ptype==='crack'?'kernel':'blanched';
      const c=take(P(r.cat,from),r.inKg);
      add(P(r.cat,to),r.outKg,c+total(r));
      avgAt[r.id]=r.outKg>0?(c+total(r))/r.outKg:0;
    }else if(r.kind==='sell'){
      const p=P(r.cat,r.form);const a=p.kg>0.0001?p.val/p.kg:p.last;avgAt[r.id]=a;
      cogs[r.id]=take(p,r.kg);
    }
  }
  for(const c of S.cats){for(const f of Object.keys(FORMS))P(c,f);}
  LC={pools,cogs,avgAt};return LC;
}
function stockOf(cat,form){const p=ledger().pools[cat]&&ledger().pools[cat][form];return p?{kg:p.kg,avg:p.kg>0.0001?p.val/p.kg:p.last}:{kg:0,avg:0};}

function partyMap(rl){

  const d=document.createElement('div');d.className='sheet';d.innerHTML='<div class="grab"></div>'+html;
  $('#sheets').appendChild(d);stack.push(d);$('#ov').style.display='block';
  stack.forEach((s,i)=>s.style.display=i===stack.length-1?'block':'none');
  if(onMount)onMount(d);return d;
}
function closeSheet(){const d=stack.pop();if(d)d.remove();if(stack.length)stack[stack.length-1].style.display='block';else $('#ov').style.display='none';}

function dl(id,rl){return '<datalist id="'+id+'">'+partyNames(rl).map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>';}
function seg(name,opts,val){return '<div class="seg" data-seg="'+name+'">'+opts.map(o=>'<button type="button" data-v="'+o[0]+'" class="'+(o[0]===val?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';}
function segVal(d,name){const b=d.querySelector('[data-seg="'+name+'"] button.on');return b?b.dataset.v:null;}
function bindSegs(d,cb){d.querySelectorAll('[data-seg]').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cb&&cb();}));}
function dateRow(r){return '<div class="daterow">📅 <b id="dTxt">'+fmtDT(r.date,r.time||'')+'</b><button type="button" class="lnk" id="dChg">تغيير التاريخ</button></div><input type="date" id="f_date" value="'+esc(r.date)+'" style="display:none;margin-top:6px">';}
function bindDate(d){const b=d.querySelector('#dChg'),i=d.querySelector('#f_date');b.onclick=()=>{i.style.display='block';b.style.display='none';};}
function recentNames(roles,n){const m={};for(const r of recs()){if(!roles.includes(role(r)))continue;const k=(r.party||'').trim();if(!k)continue;const t=(r.date||'')+(r.time||'');if(!m[k]||t>m[k])m[k]=t;}return Object.keys(m).sort((a,b)=>m[b]<m[a]?-1:1).slice(0,n||8);}
function nameBlock(rl,val,ph){const id='dl_'+rl;return '<input id="f_party" list="'+id+'" value="'+esc(val||'')+'" placeholder="'+ph+'" autocomplete="off">'+dl(id,rl)+'<div class="names">'+recentNames([rl],8).map(n=>'<button type="button" data-nm="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>';}
function bindNames(d){d.querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>{d.querySelector('#f_party').value=b.dataset.nm;});}
function catSeg(val){return seg('cat',S.cats.map(c=>[c,c]),val||S.cats[0]);}
function nIn(id,v,ph){return '<input id="'+id+'" inputmode="decimal" autocomplete="off" value="'+(v===undefined||v===null||v===''?'':esc(v))+'" placeholder="'+(ph||'0')+'">';}

function newMenu(){
  openSheet(head('عملية جديدة')+'<div class="menu">'+
    '<button data-act="form" data-k="buy"><b>🛒</b>شراء<small>بالكيلو أو باز</small></button>'+
    '<button data-act="form" data-k="sell"><b>💰</b>بيع<small>بقشرته / قلب / مبيّض</small></button>'+
    '<button data-act="form" data-k="crack"><b>🔨</b>تكسير<small>عند مزوّد الخدمة</small></button>'+
    '<button data-act="form" data-k="blanch"><b>💧</b>تبييض<small>عند مزوّد الخدمة</small></button>'+
    '<button class="pay1" data-act="payflow" data-dir="out"><b>💸</b>دفعت فلوس<small>لبائع أو مزوّد خدمة</small></button>'+
    '<button class="pay2" data-act="payflow" data-dir="in"><b>💵</b>قبضت فلوس<small>من مشتري</small></button>'+
    '<button data-act="expform" style="grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px"><b style="font-size:24px">🧾</b>مصروف</button></div>');
}

/* ---------- نموذج الشراء ---------- */
function formBuy(r){
  const e=!!r;r=r||{date:today(),time:nowTime(),mode:'kg',cat:S.cats[0]};
  const bz=r.sampleKer||(r.ratio?r2(r.ratio*10):'');
  const html=head(e?'تعديل شراء':'🛒 شراء جديد')+dateRow(r)+
    '<label>البائع</label>'+nameBlock('seller',r.party,'اسم البائع')+
    '<label>الصنف</label>'+catSeg(r.cat)+
    '<label>طريقة الشراء</label>'+seg('mode',[['kg','بالكيلو'],['baz','باز']],r.mode)+
    '<div id="bazBox"><label>الباز (غرام قلب صافي من 1 كغ)</label>'+nIn('f_baz',bz,'مثال 295')+'<div class="help" id="bazPct"></div></div>'+
    '<label>الوزن بقشرته (كغ)</label>'+nIn('f_shell',r.shellKg)+
    '<label id="lPrice">سعر الكغ</label>'+nIn('f_price',r.price)+
    (e?'':'<label>المبلغ المدفوع الآن ('+CUR+')</label><div class="row">'+nIn('f_paid','')+'<button type="button" class="btn sec sm" id="allPaid">الكل</button></div>')+
    '<label>ملاحظة</label><input id="f_note" value="'+esc(r.note||'')+'" placeholder="اختياري">'+
    '<div class="sum" id="sum"></div>'+
    '<button class="btn" id="saveB">💾 حفظ</button>';
  openSheet(html,d=>{
    const g=id=>d.querySelector('#'+id);
    const upd=()=>{
      const mode=segVal(d,'mode');
      g('bazBox').style.display=mode==='baz'?'block':'none';
      g('lPrice').textContent=mode==='baz'?'سعر كغ القلب الصافي':'سعر الكغ (بقشرته)';
      const sh=num(g('f_shell').value),pr=num(g('f_price').value),ra=num(g('f_baz').value)/10;
      g('bazPct').innerHTML=ra>0?'نسبة الباز: <b>'+pct(ra)+'</b>':'';
      let h='';
      if(mode==='baz'){const ker=sh*ra/100;h='القلب الصافي: <b>'+kg(ker)+' كغ</b><br>المبلغ: <span class="big">'+money(ker*pr)+'</span> '+CUR;}
      else h='المبلغ: <span class="big">'+money(sh*pr)+'</span> '+CUR+(sh>0?'':'');
      g('sum').innerHTML=h;
    };
    bindSegs(d,upd);bindDate(d);bindNames(d);
    ['f_shell','f_price','f_baz'].forEach(id=>g(id).addEventListener('input',upd));
    if(!e)g('allPaid').onclick=()=>{const mode=segVal(d,'mode');const sh=num(g('f_shell').value),pr=num(g('f_price').value),ra=num(g('f_baz').value)/10;g('f_paid').value=r3(mode==='baz'?sh*ra/100*pr:sh*pr);};
    upd();
    g('saveB').onclick=()=>{
      const o={kind:'buy',date:g('f_date').value||today(),time:r.time||nowTime(),party:g('f_party').value.trim(),cat:segVal(d,'cat'),mode:segVal(d,'mode'),
        shellKg:num(g('f_shell').value),price:num(g('f_price').value),note:g('f_note').value.trim()};
      if(o.mode==='baz'){o.sampleKer=num(g('f_baz').value);o.ratio=r2(o.sampleKer/10);}
      if(!o.party)return toast('اكتب اسم البائع','err');
      if(o.shellKg<=0)return toast('اكتب الوزن','err');
      if(o.price<=0)return toast('اكتب السعر','err');
      if(o.mode==='baz'&&(o.ratio<=0||o.ratio>100))return toast('اكتب الباز (غرام من 1 كغ)','err');
      commit(r,o,e?null:num(g('f_paid').value));
    };
  });
}
/* ---------- نموذج التكسير / التبييض ---------- */
function formProc(ptype,r){
  const e=!!r;r=r||{date:today(),time:nowTime(),ptype,cat:S.cats[0],feeOn:'in',fee:S.fees[ptype]};
  ptype=r.ptype;
  const inL=ptype==='crack'?'الوزن الداخل بقشرته (كغ)':'وزن القلب الداخل (كغ)';
  const outL=ptype==='crack'?'وزن القلب الخارج (كغ)':'وزن المبيّض الخارج (كغ)';
  const html=head((e?'تعديل ':'')+(ptype==='crack'?'🔨 تكسير':'💧 تبييض'))+dateRow(r)+
    '<label>مزوّد الخدمة</label>'+nameBlock('provider',r.party,'اسم مزوّد الخدمة')+
    '<label>الصنف</label>'+catSeg(r.cat)+
    '<div class="info" id="avail"></div>'+
    '<label>'+inL+'</label>'+nIn('f_in',r.inKg)+
    '<label>'+outL+'</label>'+nIn('f_out',r.outKg)+
    '<label>سعر الخدمة للكغ</label>'+nIn('f_fee',r.fee)+
    (e?'':'<label>المبلغ المدفوع الآن ('+CUR+')</label><div class="row">'+nIn('f_paid','')+'<button type="button" class="btn sec sm" id="allPaid">الكل</button></div>')+
    '<label>ملاحظة</label><input id="f_note" value="'+esc(r.note||'')+'" placeholder="اختياري">'+
    '<div class="sum" id="sum"></div><div id="wr"></div>'+
    '<button class="btn" id="saveB">💾 حفظ</button>';
  openSheet(html,d=>{
    const g=id=>d.querySelector('#'+id);
    const feeT=()=>{const i=num(g('f_in').value),o=num(g('f_out').value),f=num(g('f_fee').value);return r3(f*(r.feeOn==='out'?o:i));};
    const upd=()=>{
      const cat=segVal(d,'cat'),from=ptype==='crack'?'shell':'kernel';
      let s=stockOf(cat,from);if(e&&r.cat===cat)s={kg:s.kg+(r.inKg||0),avg:s.avg};
      g('avail').innerHTML='المتوفّر '+FORMS[from]+': <b>'+kg(s.kg)+' كغ</b>';
      const i=num(g('f_in').value),o=num(g('f_out').value);
      g('sum').innerHTML=(i>0&&o>0?'المردود: <b>'+pct(o/i*100)+'</b><br>':'')+'أجرة الخدمة: <span class="big">'+money(feeT())+'</span> '+CUR;
      g('wr').innerHTML=(i>s.kg+0.001?'<div class="warn">⚠️ الوزن الداخل أكثر من المتوفّر في المخزون</div>':'')+(o>i&&i>0?'<div class="warn">⚠️ الوزن الخارج أكبر من الداخل</div>':'');
    };
    bindSegs(d,upd);bindDate(d);bindNames(d);['f_in','f_out','f_fee'].forEach(id=>g(id).addEventListener('input',upd));
    if(!e)g('allPaid').onclick=()=>{g('f_paid').value=feeT();};
    upd();
    g('saveB').onclick=()=>{
      const o={kind:'proc',ptype,date:g('f_date').value||today(),time:r.time||nowTime(),party:g('f_party').value.trim(),cat:segVal(d,'cat'),
        inKg:num(g('f_in').value),outKg:num(g('f_out').value),fee:num(g('f_fee').value),feeOn:r.feeOn||'in',note:g('f_note').value.trim()};
      if(!o.party)return toast('اكتب اسم مزوّد الخدمة','err');
      if(o.inKg<=0||o.outKg<=0)return toast('اكتب الوزن الداخل و الخارج','err');
      if(o.fee>0){S.fees[ptype]=o.fee;}
      commit(r.id?r:null,o,e?null:num(g('f_paid').value));
    };
  });
}

      commit(r.id?r:null,o,e?null:num(g('f_paid').value));

function commit(old,o,paidNow){
  const now=Date.now();
  let r;
  if(old&&old.id){r=S.recs[old.id];Object.assign(r,o,{updatedAt:now});}
  else{r=Object.assign({id:uid(),createdAt:now,updatedAt:now,payments:[]},o);S.recs[r.id]=r;
    if(paidNow>0)r.payments.push({id:uid(),gid:uid(),date:today(),time:nowTime(),amount:r3(Math.min(paidNow,total(r))),note:'عند العملية'});}
  if(rest(r)<-0.0005)toast('⚠️ المدفوع أكثر من المبلغ','err');
  save();closeAll();render();toast('✅ تم الحفظ');
  if(old&&old.id)openDetail(r.id);
}

/* ---------- التفاصيل ---------- */
function openDetail(id){
  const r=S.recs[id];if(!r)return;
  const [sc,sl]=status(r);const L=ledger();
  const kv=(a,b)=>'<div class="kv"><span>'+a+'</span><span>'+b+'</span></div>';
  let h=head(kindIcon(r)+' '+kindLabel(r))+kv('التاريخ',fmtDT(r.date,r.time))+kv(r.kind==='buy'?'البائع':r.kind==='proc'?'مزوّد الخدمة':'المشتري','<b>'+esc(r.party)+'</b>')+kv('الصنف',esc(r.cat));
  if(r.kind==='buy'){
    h+=kv('الوزن بقشرته',kg(r.shellKg)+' كغ');
    if(r.mode==='baz'){
      h+=kv('الباز',(r.sampleKer?kg(r.sampleKer)+' غ · ':'')+pct(r.ratio))+kv('القلب الصافي',kg(r.shellKg*r.ratio/100)+' كغ')+kv('سعر كغ القلب',money(r.price));
      h+=kv('الكلفة لكغ بقشرته',money(r.shellKg>0?total(r)/r.shellKg:0));
    }else h+=kv('سعر الكغ',money(r.price));
  }else if(r.kind==='proc'){
    h+=kv('الداخل',kg(r.inKg)+' كغ '+(r.ptype==='crack'?'بقشرته':'قلب'))+kv('الخارج',kg(r.outKg)+' كغ '+(r.ptype==='crack'?'قلب':'مبيّض'))+
      kv('المردود',r.inKg>0?pct(r.outKg/r.inKg*100):'—')+kv('سعر الخدمة',money(r.fee)+'/كغ')+
      kv('كلفة الكغ الخارج',money(L.avgAt[r.id]||0));
  }else{
    const g=L.cogs[r.id]||0;
    h+=kv('الشكل',FORMS[r.form])+kv('الكمية',kg(r.kg)+' كغ')+kv('سعر الكغ',money(r.price))+kv('الكلفة للكغ',money(L.avgAt[r.id]||0))+
      kv('الربح','<b class="'+(total(r)-g>=0?'pos':'neg')+'">'+money(total(r)-g)+'</b>');
  }
  if(r.note)h+=kv('ملاحظة',esc(r.note));
  h+='<div class="sum"><div class="row"><span>المبلغ</span><span class="sp"></span><span class="big">'+money(total(r))+'</span></div>'+
     '<div class="row"><span>'+(r.kind==='sell'?'المقبوض':'المدفوع')+'</span><span class="sp"></span><b>'+money(paid(r))+'</b></div>'+
     '<div class="row"><span>الباقي</span><span class="sp"></span><b class="'+(rest(r)>0.0005?'neg':'pos')+'">'+money(rest(r))+'</b></div>'+
     '<span class="st '+sc+'">'+sl+'</span></div>';
  h+='<h3 style="font-size:16px;margin-top:16px">'+(r.kind==='sell'?'💵 الدفعات المقبوضة':'💵 الدفعات')+'</h3>';
  h+=(r.payments||[]).length?(r.payments.map(p=>'<div class="pay"><span data-act="rcptPay" data-g="'+(p.gid||p.id)+'">'+fmtDT(p.date,p.time)+' 📄</span><b>'+money(p.amount)+'</b><span class="muted sp">'+esc(p.note||'')+'</span><button data-act="delpay" data-id="'+r.id+'" data-p="'+p.id+'">🗑</button></div>').join('')):'<div class="muted">لا توجد دفعات</div>';
  h+='<div class="btns">'+(rest(r)>0.0005?'<button class="btn br" data-act="addpay" data-id="'+r.id+'">➕ '+(r.kind==='sell'?'قبض دفعة':'دفع دفعة')+'</button>':'')+'</div>'+
     '<button class="btn wa" data-act="rcptRec" data-id="'+r.id+'">📄 وصل PDF (واتساب / ماسنجر)</button>'+
     '<div class="btns"><button class="btn sec" data-act="edit" data-id="'+r.id+'">✏️ تعديل</button><button class="btn red" data-act="del" data-id="'+r.id+'">🗑 حذف</button></div>';
  openSheet(h);
}
function payForm(id){
  const r=S.recs[id];const x=Math.max(0,rest(r));
  openSheet(head(r.kind==='sell'?'قبض دفعة':'دفع دفعة')+'<div class="muted">'+esc(r.party)+' · الباقي '+money(x)+' '+CUR+'</div>'+
    '<label>المبلغ</label><div class="row">'+nIn('p_amt',r3(x))+'<button type="button" class="btn sec sm" id="pAll">الباقي كله</button></div>'+
    '<div class="daterow">📅 <b>'+fmtDT(today(),nowTime())+'</b></div>'+
    '<label>📝 ملاحظة</label><textarea id="p_note" rows="2" placeholder="مثلا: نقدا، صك رقم…، دفعها ابنه، تذكير…"></textarea>'+
    '<button class="btn" id="pSave">💾 حفظ الدفعة</button>',d=>{
      d.querySelector('#pAll').onclick=()=>d.querySelector('#p_amt').value=r3(x);

        r.updatedAt=Date.now();save();closeAll();render();afterPay(gid);
      };

/* ---------- صفحة الطرف ---------- */
function openParty(name){
  const rl=pRole;
  const list=sorted(recs().filter(r=>role(r)===rl&&(r.party||'—').trim()===name)).reverse();
  let tot=0,pd=0;list.forEach(r=>{tot+=total(r);pd+=paid(r);});const x=r3(tot-pd);
  let h=head('👤 '+esc(name))+'<div class="muted">'+ROLES[rl]+'</div>'+
    '<div class="sum"><div class="row"><span>المجموع</span><span class="sp"></span><b>'+money(tot)+'</b></div><div class="row"><span>'+(rl==='customer'?'المقبوض':'المدفوع')+'</span><span class="sp"></span><b>'+money(pd)+'</b></div><div class="row"><span>الباقي</span><span class="sp"></span><span class="big '+(x>0.0005?'neg':'')+'">'+money(x)+'</span></div></div>';
  if(x>0.0005)h+='<button class="btn br" data-act="ppay" data-name="'+esc(name)+'" data-dir="'+(rl==='customer'?'in':'out')+'">'+(rl==='customer'?'💵 قبضت منه':'💸 دفعت له')+'</button>';
  const pe=payEvents().filter(e=>e.party===name&&e.dir===(rl==='customer'?'in':'out'));
  if(pe.length)h+='<h3 style="font-size:16px;margin-top:16px">💵 سجل الدفعات</h3>'+pe.map(e=>'<div class="pay" data-act="rcptPay" data-g="'+e.k+'"><span>'+fmtDT(e.date,e.time)+'</span><span class="sp muted">'+esc(e.note)+'</span><b>'+money(e.amount)+'</b><span>📄</span></div>').join('');
  h+='<h3 style="font-size:16px;margin-top:16px">📋 العمليات</h3><div>'+list.map(itemHTML).join('')+'</div>';
  openSheet(h);
}
function openFor(dir,name){
  const roles=dir==='out'?['seller','provider']:['customer'];
  return sorted(recs().filter(r=>roles.includes(role(r))&&(!name||(r.party||'').trim()===name)&&rest(r)>0.0005));
}
function payFlow(dir,preName){
  const roles=dir==='out'?['seller','provider']:['customer'];
  const m={};for(const r of openFor(dir)){const n=(r.party||'').trim();m[n]=(m[n]||0)+rest(r);}

function csvExport(m){
  let list=sorted(recs());if(m!=='all')list=list.filter(r=>r.date&&r.date.startsWith(m));
  const L=ledger();
  const q=v=>{v=v==null?'':String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['التاريخ','النوع','الصنف','الطرف','الشكل','الوزن الداخل كغ','الوزن الخارج كغ','نسبة الباز/المردود %','السعر للكغ','المبلغ','المدفوع','الباقي','الحالة','الكلفة','الربح','ملاحظة']];
  for(const r of list){
    let form='',inK='',outK='',ratio='',cost='',prof='';
    if(r.kind==='buy'){form='بقشرته';inK=r2(r.shellKg);if(r.mode==='baz'){outK=r2(r.shellKg*r.ratio/100);ratio=r.ratio;}}
    else if(r.kind==='proc'){form=r.ptype==='crack'?'بقشرته ← قلب':'قلب ← مبيّض';inK=r2(r.inKg);outK=r2(r.outKg);ratio=r.inKg>0?r2(r.outKg/r.inKg*100):'';}
    else{form=FORMS[r.form];outK=r2(r.kg);cost=r3(L.cogs[r.id]||0);prof=r3(total(r)-(L.cogs[r.id]||0));}
    rows.push([r.date,kindLabel(r),r.cat,r.party,form,inK,outK,ratio,r.kind==='proc'?r.fee:r.price,total(r),paid(r),rest(r),status(r)[1],cost,prof,r.note||'']);
  }
    let ex=exps();if(m!=='all')ex=ex.filter(x=>x.date.startsWith(m));
  for(const x of ex.slice().reverse())rows.push([x.date,'مصروف','','','','','','','',x.amount,x.amount,0,'خالص','','',x.what]);
const csv='﻿'+rows.map(x=>x.map(q).join(',')).join('\r\n');
  saveFile('Pistalouz-'+(m==='all'?'الكل':m)+'.csv',csv,'text/csv');
}

  const n=Object.values(o.recs).filter(r=>!r.deleted).length;
  ask('📥 استرجاع','سيتم استبدال كل البيانات الحالية ('+recs().length+' عملية) بالنسخة ('+n+' عملية). هل أنت متأكد؟','استرجاع',()=>{
    const myPin=S.pin;S=Object.assign(defState(),o);S.pin=myPin;if(!S.exps)S.exps={};save();closeAll();render();toast('✅ تم الاسترجاع');
  },true);
}

  switch(a){
    case 'close':closeSheet();break;
    case 'new':closeAll();newMenu();break;
    case 'form':closeAll();if(t.dataset.k==='buy')formBuy();else if(t.dataset.k==='sell')formSell();else formProc(t.dataset.k);break;
    case 'open':openDetail(id);break;
    case 'edit':{const r=S.recs[id];closeAll();if(r.kind==='buy')formBuy(r);else if(r.kind==='sell')formSell(r);else formProc(r.ptype,r);break;}
    case 'del':ask('🗑 حذف','هل تريد حذف هذه العملية؟ لا يمكن التراجع.','حذف',()=>{const r=S.recs[id];r.deleted=true;r.updatedAt=Date.now();save();closeAll();render();toast('تم الحذف');},true);break;
    case 'addpay':payForm(id);break;
    case 'delpay':ask('حذف الدفعة','هل تريد حذف هذه الدفعة؟','حذف',()=>{const r=S.recs[id];r.payments=r.payments.filter(p=>p.id!==t.dataset.p);r.updatedAt=Date.now();save();closeAll();render();openDetail(id);},true);break;
    case 'fk':fKind=t.dataset.k;render();break;
    case 'prole':pRole=t.dataset.role;render();break;
    case 'role':pRole=t.dataset.role;go('parties');break;
    case 'party':openParty(t.dataset.name);break;
    case 'ppay':closeAll();payFlow(t.dataset.dir,t.dataset.name);break;
    case 'payflow':closeAll();payFlow(t.dataset.dir);break;
    case 'expform':closeAll();formExp();break;
    case 'expopen':openExp(id);break;
    case 'expedit':{const x=S.exps[id];closeAll();formExp(x);break;}
    case 'expdel':ask('🗑 حذف','هل تريد حذف هذا المصروف؟','حذف',()=>{S.exps[id].deleted=true;S.exps[id].updatedAt=Date.now();save();closeAll();render();toast('تم الحذف');},true);break;
    case 'expview':fKind='exp';fMonth='all';go('list');break;
    case 'perseg':{const b=e.target.closest('button');if(b&&b.dataset.v){per=b.dataset.v;anchor=today();render();}break;}
    case 'pshift':anchor=shiftAnchor(per,anchor,+t.dataset.k);render();break;
    case 'rcptPay':{const ev=payEvents().find(x=>x.k===t.dataset.g);if(ev)showReceipt(rcptPayHTML(ev),(ev.dir==='in'?'وصل-قبض-':'وصل-خلاص-')+ev.party+'-'+ev.date+'.pdf');break;}
    case 'rcptRec':{const r=S.recs[id];showReceipt(rcptRecHTML(r),'وصل-'+kindLabel(r)+'-'+r.party+'-'+r.date+'.pdf');break;}
    case 'pinset':closeAll();showLock('new');break;
    case 'pinchg':closeAll();pinAfterOld='change';showLock('old');break;
    case 'pindel':closeAll();pinAfterOld='remove';showLock('old');break;
    case 'savebiz':S.biz={name:$('#bizName').value.trim(),phone:$('#bizPhone').value.trim()};save();toast('✅ تم الحفظ');break;
    case 'settings':closeAll();openSettings();break;
    case 'addcat':{const v=($('#newCat').value||'').trim();if(!v)return;if(!S.cats.includes(v))S.cats.push(v);save();closeAll();openSettings();render();break;}
    case 'delcat':S.cats=S.cats.filter(c=>c!==t.dataset.c);save();closeAll();openSettings();render();break;
    case 'csv':csvExport($('#expMonth').value);break;
    case 'backup':S.lastManual=Date.now();save();saveFile('Pistalouz-نسخة-'+today()+'.json',JSON.stringify(Object.assign({},S,{pin:null})),'application/json');break;
    case 'restore':$('#fileIn').value='';$('#fileIn').click();break;
  }
});
$('#ov').addEventListener('click',closeSheet);
document.addEventListener('change',e=>{
  if(e.target.id==='selMonth'){month=e.target.value;render();}
  if(e.target.id==='selFMonth'){fMonth=e.target.value;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){fText=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}
});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>restoreFrom(String(rd.result));rd.onerror=()=>toast('⚠️ تعذّرت قراءة الملف','err');rd.readAsText(f);});

/* ================== الرقم السري ================== */
async function sha(t){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h1=0x811c9dc5,h2=0x1234567;for(let i=0;i<t.length;i++){h1=Math.imul(h1^t.charCodeAt(i),16777619);h2=Math.imul(h2+t.charCodeAt(i),2654435761);}return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16);
}
let pinBuf='',pinMode='unlock',pinFirst='',pinFails=0,pinWaitUntil=0,hiddenAt=0;
function lockOn(){return !!(S.pin&&S.pin.h);}
function showLock(mode,msg){
  pinMode=mode;pinBuf='';pinFirst='';
  $('#lockLogo').innerHTML=document.querySelector('.brand .lg').innerHTML;
  $('#lockMsg').textContent=msg||(mode==='unlock'?'أدخل الرقم السري':mode==='new'?'اختر رقما سريا جديدا (4 أرقام)':mode==='old'?'أدخل الرقم السري الحالي':'');
  $('#lockMsg').className='msg';
  const keys=['1','2','3','4','5','6','7','8','9',(mode==='unlock'?'':'✕'),'0','⌫'];
  $('#lockKeys').innerHTML=keys.map(k=>k?'<button data-k="'+k+'">'+k+'</button>':'<button class="blank" disabled></button>').join('');
  drawDots();$('#lock').style.display='flex';
}
function drawDots(){$('#lockDots').innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<pinBuf.length?'f':'')+'"></i>').join('');}
function lockMsg(t,err){const m=$('#lockMsg');m.textContent=t;m.className='msg'+(err?' err':'');}
function hideLock(){$('#lock').style.display='none';pinBuf='';pinMode='idle';}
async function pinDone(){
  const code=pinBuf;pinBuf='';drawDots();
  if(pinMode==='unlock'){
    if(Date.now()<pinWaitUntil){lockMsg('انتظر قليلا ثم حاول من جديد',true);return;}
    if(await sha(S.pin.s+code)===S.pin.h){pinFails=0;hideLock();return;}
    pinFails++;
    if(pinFails>=5){pinWaitUntil=Date.now()+30000;pinFails=0;lockMsg('رقم خاطئ 5 مرات. انتظر 30 ثانية',true);}
    else lockMsg('الرقم السري غير صحيح',true);
  }else if(pinMode==='old'){
    if(await sha(S.pin.s+code)===S.pin.h){
      if(pinAfterOld==='remove'){S.pin=null;save();hideLock();toast('🔓 تم إلغاء الرقم السري');closeAll();openSettings();}
      else{pinMode='new';lockMsg('اختر رقما سريا جديدا (4 أرقام)');}
    }else lockMsg('الرقم السري غير صحيح',true);
  }else if(pinMode==='new'){pinFirst=code;pinMode='confirm';lockMsg('أعد كتابة نفس الرقم للتأكيد');}
  else if(pinMode==='confirm'){
    if(code!==pinFirst){pinMode='new';pinFirst='';lockMsg('الرقمان غير متطابقين، اختر من جديد',true);return;}
    const salt=uid();S.pin={s:salt,h:await sha(salt+code)};save();hideLock();
    toast('🔒 تم حفظ الرقم السري');closeAll();openSettings();
  }
}
let pinAfterOld='';
$('#lockKeys').addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='✕'){hideLock();return;}
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawDots();return;}
  if(pinBuf.length<4){pinBuf+=k;drawDots();if(pinBuf.length===4)setTimeout(pinDone,120);}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(lockOn()&&hiddenAt&&Date.now()-hiddenAt>60000&&$('#lock').style.display!=='flex'){closeAll();showLock('unlock');}
});

/* ================== آيفون (بدون تطبيق أندرويد) ================== */
const WEBMODE=!BR;
function needBackup(){if(!WEBMODE||!recs().length&&!exps().length)return false;const l=S.lastManual||0;return Date.now()-l>7*864e5;}
async function webSave(name,content,mime){
  try{
    const f=new File([content],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  try{const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;}catch(e){toast('⚠️ تعذّر حفظ الملف','err');return false;}
}
if(WEBMODE&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

loadState();render();
if(lockOn())showLock('unlock');
</script>
